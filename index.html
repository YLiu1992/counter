<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技能训练倒计时 | 课堂计时器</title>
<style>
:root{
  --bg1:#0d1b2a; --bg2:#1b2f4a;
  --card:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.14);
  --text:#e8eef7;
  --muted:#8fa3bd;
  --accent:#f97316;
  --accent2:#38bdf8;
  --danger:#ef4444;
  --ok:#22c55e;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(1200px 800px at 50% -10%, #1d3a5f 0%, var(--bg1) 45%, var(--bg2) 100%);
  color:var(--text);
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;
  padding:18px 16px 26px;
  overflow-x:hidden;
  user-select:none;
}
/* ===== 顶部 ===== */
.top{
  width:min(1080px,100%);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:4px 6px 14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;}
.logo{font-size:1.9rem;}
h1{font-size:clamp(1.15rem,3vw,1.65rem);font-weight:800;letter-spacing:.05em;}
.clock{
  font-size:clamp(.95rem,2.4vw,1.3rem);font-weight:700;color:var(--muted);
  font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.06);border:1px solid var(--border);
  padding:8px 16px;border-radius:10px;white-space:nowrap;
}
/* ===== 主计时区 ===== */
.stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:10px 0 14px;}
.ring-wrap{position:relative;width:min(76vw,540px);aspect-ratio:1;}
.ring{width:100%;height:100%;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:16;}
.ring-fg{
  fill:none;stroke:url(#grad);stroke-width:16;stroke-linecap:round;
  stroke-dasharray:1570;stroke-dashoffset:0;
  transition:stroke-dashoffset 1s linear, stroke .4s;
  filter:drop-shadow(0 0 12px rgba(249,115,22,.35));
}
.display{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  text-align:center;padding:0 10px;
}
.time-text{
  font-size:clamp(4.2rem,17vw,9.8rem);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  text-shadow:0 8px 34px rgba(0,0,0,.45);
  transition:color .3s;
}
.status{font-size:clamp(1rem,2.6vw,1.35rem);color:var(--muted);letter-spacing:.35em;font-weight:600;}
.alarm-msg{
  display:none;font-size:clamp(2rem,7vw,4rem);font-weight:900;color:var(--danger);
  letter-spacing:.06em;text-shadow:0 0 46px rgba(239,68,68,.85);
}
.alarm-msg.show{display:block;animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
/* 运行中 */
body.running .status{color:var(--ok);}
/* 最后10秒警告 */
body.warning .time-text{color:var(--accent);animation:pulse .8s infinite;}
body.warning .ring-fg{stroke:var(--accent);}
/* 时间到 */
body.alarm .time-text{color:var(--danger);animation:shake .45s infinite;}
body.alarm .status{display:none;}
.alarm-overlay{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:4;background:transparent;}
body.alarm .alarm-overlay{opacity:1;animation:flashBg .7s infinite;}
@keyframes flashBg{0%,100%{background:rgba(239,68,68,.16);}50%{background:rgba(239,68,68,.42);}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
@keyframes pop{0%{transform:scale(.3);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
/* ===== 控制面板 ===== */
.panel{
  width:min(940px,100%);
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:20px 22px;
  display:flex;flex-direction:column;gap:16px;
}
.set-row{display:flex;align-items:flex-end;justify-content:center;gap:10px;flex-wrap:wrap;}
.field{display:flex;flex-direction:column;align-items:center;gap:5px;}
.field span{font-size:.82rem;color:var(--muted);letter-spacing:.18em;font-weight:600;}
.field input{
  width:96px;font-size:2.1rem;font-weight:700;text-align:center;color:var(--text);
  background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:12px;
  padding:7px 4px;outline:none;font-variant-numeric:tabular-nums;
  transition:border-color .2s, box-shadow .2s;
}
.field input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(56,189,248,.2);}
.colon{font-size:2.3rem;font-weight:800;color:var(--muted);padding-bottom:9px;}
.btn{
  border:none;border-radius:12px;padding:13px 22px;font-size:1.08rem;font-weight:700;
  cursor:pointer;color:var(--text);font-family:inherit;
  transition:transform .12s, box-shadow .2s, background .2s, opacity .2s;
}
.btn:active{transform:scale(.95);}
.btn.primary{
  background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;
  box-shadow:0 8px 26px rgba(249,115,22,.35);
  padding:15px 44px;font-size:1.35rem;letter-spacing:.08em;
}
.btn.primary:hover{box-shadow:0 10px 32px rgba(249,115,22,.5);}
.btn.warn{background:rgba(56,189,248,.14);border:1px solid rgba(56,189,248,.42);color:var(--accent2);}
.btn.warn:hover{background:rgba(56,189,248,.24);}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--border);}
.btn.ghost:hover{background:rgba(255,255,255,.15);}
.btn:disabled{opacity:.38;cursor:not-allowed;}
.btn-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;}
.preset-row{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;}
.preset-label{font-size:.82rem;color:var(--muted);letter-spacing:.15em;font-weight:600;margin-right:2px;}
.chip{
  background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);
  border-radius:999px;padding:8px 16px;font-size:.95rem;cursor:pointer;font-family:inherit;
  transition:background .2s, border-color .2s, color .2s;white-space:nowrap;
}
.chip:hover{background:rgba(249,115,22,.16);border-color:var(--accent);color:#ffd8b5;}
.chip.active{background:rgba(249,115,22,.22);border-color:var(--accent);color:#ffd8b5;}
/* ===== 页脚 ===== */
.tip{
  width:min(940px,100%);text-align:center;color:var(--muted);
  font-size:.88rem;padding-top:14px;letter-spacing:.06em;
}
kbd{
  background:rgba(255,255,255,.1);border:1px solid var(--border);border-bottom-width:2px;
  border-radius:6px;padding:2px 8px;font-size:.82rem;font-family:inherit;color:var(--text);
}
/* ===== 响应式 ===== */
@media (max-width:640px){
  body{padding:12px 10px 20px;}
  .panel{padding:16px 14px;gap:14px;}
  .field input{width:76px;font-size:1.7rem;}
  .btn.primary{width:100%;}
  .btn-row .btn{flex:1;min-width:118px;}
  .btn-row{padding:0 4px;}
  .top{justify-content:center;}
}
@media (max-height:720px){
  .ring-wrap{width:min(56vw,380px);}
  .time-text{font-size:clamp(3.4rem,14vh,7rem);}
}
</style>
</head>
<body>

<div class="alarm-overlay"></div>

<header class="top">
  <div class="brand">
    <span class="logo">⏱️</span>
    <h1>技能训练倒计时</h1>
  </div>
  <div class="clock" id="curClock">--:--:--</div>
</header>

<main class="stage">
  <div class="ring-wrap">
    <svg class="ring" viewBox="0 0 560 560" aria-hidden="true">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="100%" stop-color="#f97316"/>
        </linearGradient>
      </defs>
      <circle class="ring-bg" cx="280" cy="280" r="250"></circle>
      <circle class="ring-fg" id="ringFg" cx="280" cy="280" r="250"></circle>
    </svg>
    <div class="display">
      <div class="alarm-msg" id="alarmMsg">⏰ 时间到！</div>
      <div class="time-text" id="timeText">05:00</div>
      <div class="status" id="statusText">就 绪</div>
    </div>
  </div>
</main>

<section class="panel">
  <div class="set-row">
    <label class="field">
      <span>分钟</span>
      <input type="number" id="minInput" min="0" max="99" value="5" inputmode="numeric">
    </label>
    <span class="colon">:</span>
    <label class="field">
      <span>秒</span>
      <input type="number" id="secInput" min="0" max="59" value="0" inputmode="numeric">
    </label>
    <button class="btn ghost" id="applyBtn" style="margin-bottom:2px;">✓ 应用时间</button>
  </div>
  <div class="preset-row">
    <span class="preset-label">常用时长</span>
    <button class="chip" data-sec="30">30秒</button>
    <button class="chip" data-sec="60">1分</button>
    <button class="chip" data-sec="120">2分</button>
    <button class="chip" data-sec="180">3分</button>
    <button class="chip" data-sec="300">5分</button>
    <button class="chip" data-sec="600">10分</button>
    <button class="chip" data-sec="900">15分</button>
    <button class="chip" data-sec="1200">20分</button>
  </div>
  <div class="btn-row">
    <button class="btn primary" id="startBtn">▶ 开 始</button>
    <button class="btn warn" id="pauseBtn" disabled>⏸ 暂 停</button>
    <button class="btn ghost" id="resetBtn">↺ 重 置</button>
    <button class="btn ghost" id="fullBtn">⛶ 全 屏</button>
  </div>
</section>

<footer class="tip">
  按 <kbd>空格</kbd> 开始 / 暂停 &nbsp;·&nbsp; 按 <kbd>Enter</kbd> 应用时间 &nbsp;·&nbsp; 建议投屏后点击「全屏」使用
</footer>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var minInput = $('minInput'), secInput = $('secInput');
  var timeText = $('timeText'), statusText = $('statusText'), alarmMsg = $('alarmMsg');
  var ringFg = $('ringFg'), startBtn = $('startBtn'), pauseBtn = $('pauseBtn');
  var resetBtn = $('resetBtn'), applyBtn = $('applyBtn'), fullBtn = $('fullBtn');

  var R = 250, CIRC = 2 * Math.PI * R;
  ringFg.style.strokeDasharray = CIRC;

  var total = 300, remain = 300;
  var timer = null, running = false, paused = false, alarm = false;
  var audioCtx = null;

  /* ---------- 工具 ---------- */
  function fmt(s){
    var m = Math.floor(s / 60), sec = s % 60;
    return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }
  function setStatus(t){ statusText.textContent = t; }
  function render(){
    timeText.textContent = fmt(remain);
    var ratio = total > 0 ? remain / total : 0;
    ringFg.style.strokeDashoffset = CIRC * (1 - ratio);
    document.body.classList.toggle('warning', !alarm && remain > 0 && remain <= 10);
  }
  function clearTimer(){
    if(timer){ clearInterval(timer); timer = null; }
  }
  function stopAlarm(){
    alarm = false;
    document.body.classList.remove('alarm');
    alarmMsg.classList.remove('show');
    document.body.classList.remove('warning');
  }

  /* ---------- 时间设置 ---------- */
  function applyTime(){
    var m = parseInt(minInput.value, 10) || 0;
    var s = parseInt(secInput.value, 10) || 0;
    if(s >= 60){ m += Math.floor(s / 60); s = s % 60; }
    if(m > 99){ m = 99; }
    var t = m * 60 + s;
    if(t <= 0){
      alert('请设置大于 0 的时长');
      minInput.focus();
      return;
    }
    clearTimer();
    total = t; remain = t;
    running = false; paused = false;
    stopAlarm();
    setStatus('就 绪');
    startBtn.disabled = false; startBtn.textContent = '▶ 开 始';
    pauseBtn.disabled = true;
    render();
    markPreset(t);
  }

  /* ---------- 控制 ---------- */
  function start(){
    if(alarm) stopAlarm();
    if(remain <= 0){ applyTime(); return; }
    if(timer) return;
    initAudio();
    running = true; paused = false;
    startBtn.disabled = true; pauseBtn.disabled = false;
    setStatus('运行中');
    document.body.classList.add('running');
    timer = setInterval(tick, 1000);
  }
  function tick(){
    remain--;
    render();
    if(remain <= 0){
      clearTimer();
      fireAlarm();
    }
  }
  function pause(){
    if(!running) return;
    clearTimer();
    running = false; paused = true;
    startBtn.disabled = false; startBtn.textContent = '▶ 继 续';
    pauseBtn.disabled = true;
    setStatus('已暂停');
    document.body.classList.remove('running');
  }
  function reset(){
    clearTimer();
    remain = total;
    running = false; paused = false;
    stopAlarm();
    setStatus('就 绪');
    startBtn.disabled = false; startBtn.textContent = '▶ 开 始';
    pauseBtn.disabled = true;
    document.body.classList.remove('running');
    render();
  }

  /* ---------- 时间到 ---------- */
  function fireAlarm(){
    running = false; paused = false;
    startBtn.disabled = false; startBtn.textContent = '▶ 开 始';
    pauseBtn.disabled = true;
    setStatus('时间到');
    alarm = true;
    document.body.classList.add('alarm');
    alarmMsg.classList.add('show');
    timeText.textContent = '00:00';
    ringFg.style.strokeDashoffset = CIRC;
    playAlarm();
    if(navigator.vibrate){ navigator.vibrate([320, 160, 320, 160, 320]); }
  }

  /* ---------- 声音（Web Audio 合成，无需音频文件） ---------- */
  function initAudio(){
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
  }
  function playAlarm(){
    if(!audioCtx) return;
    var now = audioCtx.currentTime;
    var i, t, osc, g;
    for(i = 0; i < 8; i++){
      t = now + i * 0.32;
      osc = audioCtx.createOscillator();
      g = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(i % 2 ? 740 : 880, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.32);
    }
  }

  /* ---------- 预设时长 ---------- */
  function markPreset(t){
    var chips = document.querySelectorAll('.chip');
    for(var i = 0; i < chips.length; i++){
      chips[i].classList.toggle('active', parseInt(chips[i].getAttribute('data-sec'), 10) === t);
    }
  }
  document.querySelectorAll('.chip').forEach(function(btn){
    btn.addEventListener('click', function(){
      var t = parseInt(btn.getAttribute('data-sec'), 10) || 0;
      minInput.value = Math.floor(t / 60);
      secInput.value = t % 60;
      applyTime();
    });
  });

  /* ---------- 全屏 ---------- */
  fullBtn.addEventListener('click', function(){
    var docEl = document.documentElement;
    if(!document.fullscreenElement){
      if(docEl.requestFullscreen){ docEl.requestFullscreen(); }
      else if(docEl.webkitRequestFullscreen){ docEl.webkitRequestFullscreen(); }
    } else {
      if(document.exitFullscreen){ document.exitFullscreen(); }
      else if(document.webkitExitFullscreen){ document.webkitExitFullscreen(); }
    }
  });

  /* ---------- 事件绑定 ---------- */
  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', pause);
  resetBtn.addEventListener('click', reset);
  applyBtn.addEventListener('click', applyTime);
  minInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') applyTime(); });
  secInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') applyTime(); });

  /* 空格开始/暂停 */
  document.addEventListener('keydown', function(e){
    var tag = e.target.tagName;
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;
    if(e.code === 'Space'){
      e.preventDefault();
      if(running){ pause(); } else { start(); }
    } else if(e.key === 'Enter'){
      applyTime();
    }
  });

  /* ---------- 顶部时钟 ---------- */
  var week = ['日','一','二','三','四','五','六'];
  function tickClock(){
    var d = new Date();
    var pad = function(n){ return String(n).padStart(2, '0'); };
    $('curClock').textContent =
      d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' 周' + week[d.getDay()] + ' ' +
      pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* ---------- 初始化 ---------- */
  applyTime();
})();
</script>
</body>
</html>
